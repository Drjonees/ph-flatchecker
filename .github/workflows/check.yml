name: Tjek ledige boliger

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tjek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tjek siden
        run: node check.mjs
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: Gem status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.json
          git diff --cached --quiet || (git commit -m "update status" && git push)
