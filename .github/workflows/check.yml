name: Tjek ledige boliger

on:
  schedule:
    # Cron kører i UTC. 06-19 UTC dækker 08-20 dansk tid både sommer og vinter.
    - cron: "7 6-19 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tjek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tjek siden
        run: |
          time=$(TZ=Europe/Copenhagen date +%-H)
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && { [ "$time" -lt 8 ] || [ "$time" -gt 20 ]; }; then
            echo "Klokken er $time dansk tid, uden for 08-20. Springer over."
            exit 0
          fi
          node check.mjs
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: Gem status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.json
          git diff --cached --quiet || (git commit -m "update status" && git push)
